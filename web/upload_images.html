<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Subir imagens — Pedal Hidrográfico</title>
<link rel="stylesheet" href="./fonts/fonts.css">
<style>
  /* Paleta espelhada do app (style.css) pra o formulário combinar com o modal. */
  :root {
    --bg: #fafbfc; --panel: #ffffff; --surface: #eef1f4;
    --text: #101820; --muted: #4a5867;
    --accent: #c2410c; --accent-hover: #9a3412; --border: #c6ced6;
    /* estados (verde/amarelo/vermelho) em versões que leem bem no escuro */
    --ok: #1a7f4b; --warn: #9c6a10; --err: #b3261e;
  }
  body { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace; max-width: 1400px; margin: 1.5rem auto; padding: 0 1rem;
    color: var(--text); background: var(--bg); transition: background .2s; }
  h1 { font-size: 1.4rem; margin: 0 0 .25rem; }
  p.lede { color: var(--muted); margin: 0 0 1rem; }
  a { color: var(--accent); }
  fieldset { border: 1px solid var(--border); padding: 1rem; margin: 1rem 0; border-radius: 8px; background: var(--panel); }
  legend { font-weight: 600; padding: 0 .4rem; color: var(--text); }
  label { display: block; margin: .6rem 0 .2rem; font-size: .9rem; color: var(--text); }
  input[type="file"], input[type="text"], input[type="number"], input[type="datetime-local"], select {
    width: 100%; padding: .45rem; box-sizing: border-box; font-size: 1rem; font-family: inherit;
    background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 5px;
  }
  input::placeholder { color: var(--muted); }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
  small { display: block; color: var(--muted); font-size: .8rem; margin-top: .25rem; }
  pre { background: var(--surface); color: var(--text); padding: 1rem; overflow-x: auto; font-size: .85rem; border-radius: 4px; white-space: pre-wrap; word-break: break-word; border: 1px solid var(--border); }
  .actions { margin: 1rem 0; display: flex; gap: .5rem; flex-wrap: wrap; }
  button { padding: .5rem 1rem; font-size: 1rem; cursor: pointer; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); border-radius: 5px; }
  button:hover:not([disabled]) { border-color: var(--accent); color: var(--accent); }
  button[disabled] { opacity: .45; cursor: not-allowed; }
  /* Ações primárias (Enviar / Salvar) em laranja de destaque, como o app. */
  .upload-all-btn, .card-send {
    background: var(--accent); border-color: var(--accent); color: #201206; font-weight: 600;
  }
  .upload-all-btn:hover:not([disabled]), .card-send:hover:not([disabled]) {
    background: var(--accent-hover); border-color: var(--accent-hover); color: #201206;
  }
  .required::after { content: " *"; color: var(--err); }
  .ok { color: var(--ok); }
  .warn { color: var(--warn); }
  .err { color: var(--err); }
  code { background: var(--surface); border: 1px solid var(--border); padding: 0 .25rem; border-radius: 3px; font-size: .9em; }

  /* Upload zone (padrões em cima, seletor de arquivos embaixo) */
  .upload-row {
    display: grid;
    grid-template-columns: 1fr;
    gap: 1rem;
  }
  #upload-zone { margin-top: 0; transition: background .2s, border-color .2s; }

  /* Grupo colapsável: a legenda vira um botão que expande/recolhe o corpo. */
  #upload-zone legend { padding: 0; }
  .zone-toggle {
    font: inherit; font-weight: 600; background: none; border: 0; cursor: pointer;
    padding: 0 .3rem; color: inherit; display: inline-flex; align-items: center; gap: .35rem;
  }
  .zone-toggle:hover { color: var(--accent); }
  .zone-toggle .caret { display: inline-block; font-size: .8em; transition: transform .15s; }
  #upload-zone.collapsed .caret { transform: rotate(-90deg); }
  #upload-zone.collapsed .upload-row { display: none; }

  /* Cor do grupo reflete o estado do lote: verde=ok, amarelo=aviso, vermelho=erro. */
  #upload-zone.state-ok   { background: rgba(64, 200, 96, 0.12);  border-color: rgba(64, 200, 96, 0.5); }
  #upload-zone.state-warn { background: rgba(240, 200, 60, 0.12); border-color: rgba(240, 200, 60, 0.5); }
  #upload-zone.state-err  { background: rgba(230, 90, 90, 0.13);  border-color: rgba(230, 90, 90, 0.55); }

  /* Painel de "Opções de saída" (anonimizar/comprimir) */
  .opts { display: flex; gap: 1rem; flex-wrap: wrap; }
  .opts label { display: flex; align-items: center; gap: .35rem; margin: 0; font-size: .9rem; }
  .opts input[type="checkbox"] { width: auto; accent-color: var(--accent); }

  /* Grid de cards (1 por foto) */
  /* Grade de miniaturas (visão geral de tudo que foi adicionado). */
  #thumb-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(64px, 1fr));
    gap: .4rem;
    margin: 1rem 0 .5rem;
  }
  #thumb-grid:empty { display: none; margin: 0; }
  .thumb-grid-item {
    position: relative; aspect-ratio: 1; cursor: pointer;
    border: 2px solid var(--border); border-radius: 4px; overflow: hidden; background: var(--surface);
    padding: 0; transition: border-color .15s, box-shadow .15s;
  }
  .thumb-grid-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb-grid-item .tg-idx {
    position: absolute; top: 1px; left: 2px; font-size: .6rem; font-weight: 700;
    color: #fff; text-shadow: 0 0 3px #000, 0 0 2px #000; pointer-events: none;
  }
  .thumb-grid-item.is-video::after {
    content: "▶"; position: absolute; right: 2px; bottom: 0; font-size: .7rem;
    color: #fff; text-shadow: 0 0 3px #000;
  }
  .thumb-grid-item:hover, .thumb-grid-item:focus-visible { border-color: var(--accent); outline: none; }
  /* Estado de envio espelhado do card: amarelo=pendente, verde=enviado, vermelho=erro. */
  .thumb-grid-item.tg-pending  { border-color: rgba(240, 200, 60, 0.85); box-shadow: 0 0 0 1px rgba(240, 200, 60, 0.4); }
  .thumb-grid-item.tg-uploaded { border-color: rgba(64, 200, 96, 0.9);   box-shadow: 0 0 0 1px rgba(64, 200, 96, 0.4); }
  .thumb-grid-item.tg-error    { border-color: rgba(230, 90, 90, 0.95);  box-shadow: 0 0 0 1px rgba(230, 90, 90, 0.45); }

  /* Faixa de cards + botões de navegação nos cantos. */
  .cards-carousel { position: relative; }
  .cards-nav {
    position: absolute; top: 50%; transform: translateY(-50%); z-index: 5;
    width: 34px; height: 46px; border: 1px solid var(--border); border-radius: 6px;
    background: rgba(21, 32, 43, .92); color: var(--text); font-size: 1.4rem; line-height: 1;
    cursor: pointer; box-shadow: 0 1px 4px rgba(16, 24, 32, .16); padding: 0;
  }
  .cards-nav:hover { background: var(--panel); border-color: var(--accent); color: var(--accent); }
  .cards-nav[disabled] { opacity: .3; cursor: default; }
  .cards-nav-left  { left: -4px; }
  .cards-nav-right { right: -4px; }
  /* Realce breve quando o card é alcançado via clique numa miniatura. */
  .card.card-flash { box-shadow: 0 0 0 3px var(--accent); transition: box-shadow .2s; }

  /* Galeria horizontal: os cards viram uma faixa que rola pra esquerda/direita
     em vez de empilhar verticalmente. Mostra ~1 card no celular e vários no
     desktop; o resto fica fora da tela, alcançável pelo scroll horizontal.
     overflow-y: hidden (não visible) evita promover o eixo Y a scroll — os
     dropdowns do Tom Select escapam do clipe via dropdownParent:'body'. */
  #cards {
    display: flex;
    align-items: flex-start;
    gap: 1rem;
    margin: 1rem 0;
    overflow-x: auto;
    overflow-y: hidden;
    padding-bottom: .6rem;
    scroll-snap-type: x proximity;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior-x: contain;
  }
  #cards:empty { display: none; margin: 0; }   /* sem faixa vazia quando não há cards */
  #cards::-webkit-scrollbar { height: 9px; }
  #cards::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }
  #cards::-webkit-scrollbar-thumb:hover { background: #aeb9c4; }
  .card {
    flex: 0 0 min(360px, 82vw);
    scroll-snap-align: start;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: .75rem;
    background: var(--panel);
    font-size: .9rem;
    display: flex;
    flex-direction: column;
    gap: .25rem;
    transition: background .2s, border-color .2s;
  }
  /* Fundo do card reflete o estado de envio: amarelo=pendente, verde=enviado,
     vermelho=erro (tons que leem bem no escuro). */
  .card.card-pending  { background: rgba(240, 200, 60, 0.13); border-color: rgba(240, 200, 60, 0.45); }
  .card.card-uploaded { background: rgba(64, 200, 96, 0.15);  border-color: rgba(64, 200, 96, 0.5); }
  .card.card-error    { background: rgba(230, 90, 90, 0.15);  border-color: rgba(230, 90, 90, 0.55); }
  /* Quando TODAS as imagens foram enviadas com sucesso, o fundo do modal
     inteiro (o corpo desta página no iframe) fica levemente azulado. */
  body.all-uploaded { background: #e2f5e9; }
  body { transition: background .2s; }
  .card-header { display: flex; gap: .5rem; align-items: center; }
  .card-thumb {
    width: 56px; height: 56px;
    object-fit: cover; border-radius: 4px; background: var(--surface);
  }
  .card-meta { flex: 1; min-width: 0; }
  .card-meta strong { display: block; font-size: .85rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card-meta .hash { font-size: .65rem; color: var(--muted); word-break: break-all; }
  .card-remove {
    border: 0; background: transparent; cursor: pointer;
    font-size: 1.2rem; color: var(--err); padding: 0 .25rem; line-height: 1;
  }
  .card-remove:hover { color: #b3261e; }
  .card-section { border-top: 1px dashed var(--border); padding-top: .4rem; margin-top: .25rem; }
  .card-section h4 {
    font-size: .7rem; color: var(--muted); font-weight: 600;
    text-transform: uppercase; margin: 0 0 .25rem; letter-spacing: .04em;
  }
  .card label { font-size: .75rem; margin: .3rem 0 .1rem; }
  .card input[type="datetime-local"], .card input[type="number"], .card select { padding: .25rem .35rem; font-size: .85rem; }
  .card .row { display: flex; gap: .4rem; }
  .card .row > div { flex: 1; min-width: 0; }
  .card .tour-auto-status { font-size: .7rem; margin-top: .1rem; }

  /* Campos compactos: rótulo e valor na MESMA linha (cards mais enxutos). */
  .card .fi { display: flex; align-items: center; gap: .35rem; margin: .2rem 0; }
  .card .fi > span { flex: 0 0 auto; min-width: 2.6rem; font-size: .72rem; color: var(--muted); }
  .card .fi > input, .card .fi > select { flex: 1 1 auto; min-width: 0; margin: 0; }
  .card .fi-row { display: flex; gap: .4rem; align-items: center; margin: .2rem 0; }
  .card .fi-row > .fi { flex: 1; margin: 0; }
  .card .fi-row > .pick-on-map { flex: 0 0 auto; padding: .25rem .45rem; font-size: 1rem; line-height: 1; }

  /* Tom Select compactado dentro dos cards + tema escuro pra combinar. */
  .ts-wrapper { font-size: .85rem; }
  .card .ts-control { padding: .2rem .3rem !important; min-height: 0; }
  .ts-control { background: var(--surface) !important; border-color: var(--border) !important; color: var(--text); }
  .ts-control input, .ts-control input::placeholder { color: var(--text) !important; }
  .ts-dropdown { background: var(--panel); border-color: var(--border); color: var(--text); }
  .ts-dropdown .option.active, .ts-dropdown .option:hover { background: rgba(255, 140, 46, 0.18); color: var(--text); }
  .ts-dropdown .create:hover { background: rgba(255, 140, 46, 0.18); }
  .ts-control .item { background: rgba(255, 255, 255, 0.08); color: var(--text); }

  /* Card de vídeo: prévia + trim sliders */
  .card-video-preview {
    width: 100%; max-height: 220px; background: #000;
    border-radius: 4px; display: block;
  }
  .trim-row {
    display: grid; grid-template-columns: 40px 1fr auto; align-items: center;
    gap: .35rem; margin: .3rem 0 .1rem;
  }
  .trim-row > span { font-size: .72rem; color: var(--muted); }
  input[type="range"] { accent-color: var(--accent); }
  .trim-steppers { display: flex; gap: .15rem; }
  .trim-step-btn {
    background: var(--surface); border: 1px solid var(--border); border-radius: 3px; color: var(--text);
    padding: 0 .3rem; cursor: pointer; font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .75rem;
  }
  .trim-step-btn:hover { background: var(--panel); border-color: var(--accent); }
  .trim-times {
    display: flex; justify-content: space-between; gap: .4rem;
    font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .7rem; color: var(--muted);
    margin-top: .25rem;
  }
  .trim-times .warn { color: var(--err); }
</style>

<body>

<h1>Subir imagens</h1>

<form id="form">

  <!-- Grupo "Adicionar imagens e vídeos" — no topo, acima do Enviar todas. -->
  <fieldset id="upload-zone">
    <legend><button type="button" class="zone-toggle" id="upload-zone-toggle" aria-expanded="true" aria-controls="upload-zone-body"><span class="caret" aria-hidden="true">▾</span> Adicionar imagens e vídeos</button></legend>
    <div class="upload-row" id="upload-zone-body">
      <div>
        <label style="font-weight:600;margin-top:0">Padrões da Atribuição</label>

        <label for="d-tour">Passeio <small style="display:inline;color:#555">(sobrescreve auto-detecção)</small></label>
        <select id="d-tour"><option value="">— deixar para auto-detecção —</option></select>

        <label for="d-author">Autoras</label>
        <select multiple id="d-author" placeholder="busca ou digita…"></select>

        <label for="d-provider">Quem subiu</label>
        <select multiple id="d-provider" placeholder="busca ou digita…"></select>

        <label for="d-list">Listas (álbuns) <small style="display:inline;color:#555">(opcional; deixe vazio p/ nenhuma)</small></label>
        <select multiple id="d-list" placeholder="busca ou cria uma lista…"></select>

        <label for="d-license">Licença</label>
        <select id="d-license">
          <option value="https://creativecommons.org/licenses/by-sa/4.0/" selected>CC BY-SA 4.0</option>
          <option value="https://creativecommons.org/licenses/by-nc-sa/4.0/">CC BY-NC-SA 4.0</option>
          <option value="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</option>
          <option value="https://creativecommons.org/licenses/by-nc/4.0/">CC BY-NC 4.0</option>
          <option value="https://creativecommons.org/publicdomain/zero/1.0/">CC0 1.0</option>
        </select>

        <label>Saída</label>
        <div class="opts">
          <label><input type="checkbox" id="d-anon"> Anonimizar (remover metadados)</label>
          <label><input type="checkbox" id="d-comp"> Comprimir imagem para 500 kB máx.</label>
        </div>
      </div>

      <div>
        <label for="files">Arquivos</label>
        <!-- accept com MIME HEIC explícito: sinaliza ao iOS que aceitamos o
             arquivo original, então em algumas versões ele entrega os bytes crus
             sem transcodificar HEIC→JPEG na hora de escolher (seleção bem mais
             rápida). NÃO corrige o truncamento do seletor de Fotos do macOS/iOS
             (entrega 1 arquivo só numa multi-seleção grande — bug do seletor a
             nível de SO, idêntico em Safari e Chrome, pois ambos usam o mesmo
             seletor do sistema). Caminho confiável p/ lotes grandes: arrastar-e-
             soltar no desktop (contorna o seletor); no celular, escolher em lotes
             menores — os cards se acumulam (dedup evita repetição). -->
        <input type="file" id="files" accept="image/*,image/heic,image/heif,video/*" multiple>
        <small id="filesStatus">Escolha ou arraste imagens. Videos serão convertidos para 360p+720p webm e cortados em 10min.</small>
        <small id="catalogStatus">Carregando catálogo…</small>
        <div id="notices" role="status" aria-live="polite" style="margin: .5rem 0;"></div>
        <div style="margin-top: .5rem">
          <button type="button" id="clearAll" disabled>Limpar todos os cards</button>
        </div>
      </div>
    </div>
  </fieldset>

  <div class="actions">
    <button type="button" id="uploadAllTop" class="upload-all-btn" disabled>📤 Enviar todas as imagens</button>
    <small id="uploadAllStatusTop" class="upload-all-status" style="margin-left:.5rem"></small>
  </div>

  <!-- Visão geral: grade de miniaturas de tudo que foi adicionado. Clicar
       numa miniatura rola a faixa de cards até o card correspondente. -->
  <div id="thumb-grid" aria-label="Miniaturas dos arquivos adicionados"></div>

  <!-- Faixa horizontal de cards + botões ‹ › nos cantos pra rolar. Mostra
       quantos couberem na largura da tela; o resto rola pra esquerda/direita. -->
  <div class="cards-carousel">
    <button type="button" class="cards-nav cards-nav-left" aria-label="Cards anteriores" hidden>‹</button>
    <div id="cards"></div>
    <button type="button" class="cards-nav cards-nav-right" aria-label="Próximos cards" hidden>›</button>
  </div>

</form>

<!-- Modal de seleção de coordenadas no mapa (Leaflet/OSM, lazy-load).
     `display:none` inline garante que o atributo `hidden` não compita com
     o `display:flex` que outros estilos poderiam impor. -->
<div id="map-picker-modal" style="
  position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 9999;
  display: none; align-items: center; justify-content: center;
">
  <div style="
    background: #fff; border-radius: 6px; padding: 1rem; width: min(800px, 95vw);
    height: min(70vh, 600px); display: flex; flex-direction: column; gap: .5rem;
  ">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <strong>Escolher coordenadas no mapa</strong>
      <button type="button" id="map-picker-close" style="font-size:1.1rem;padding:.15rem .5rem">✕</button>
    </div>
    <small style="color:#666">Clique no mapa pra posicionar — ou arraste o marcador.</small>
    <div id="map-picker-mapbox" style="flex:1;border:1px solid #ccc;border-radius:4px;"></div>
    <div style="display:flex;gap:.5rem;align-items:center;justify-content:flex-end;">
      <span id="map-picker-coords" style="font-family:'IBM Plex Mono',monospace;font-size:.85rem;color:#444;margin-right:auto;"></span>
      <button type="button" id="map-picker-cancel">Cancelar</button>
      <button type="button" id="map-picker-confirm">Usar essa posição</button>
    </div>
  </div>
</div>

<script type="module">
const $  = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];

// Boot ainda em curso (imports + catálogo): um arquivo escolhido antes do
// listener de verdade existir era silenciosamente descartado — o input ficava
// habilitado e o "change" caía no vazio. Guarda as seleções; o listener real
// (lá embaixo, handlePickedFiles) as processa assim que o boot terminar.
window._phidroEarlyPicks = [];
$('#files')?.addEventListener('change', (e) => {
  if (!window._phidroEarlyPicks) return;   // boot terminou — o listener real assumiu
  const files = [...e.target.files];
  e.target.value = '';
  if (files.length) window._phidroEarlyPicks.push(files);
});

// Embutido no iframe do app: o título vive na faixa do header do modal —
// esconde o <h1> interno pra não duplicar. Standalone mostra normalmente.
if (window.self !== window.top) $('h1')?.style.setProperty('display', 'none');

// ===================== Dependências CDN ================================
let exifr = null;
try {
  // VENDORADO em web/lib/ (antes vinha do jsdelivr). Bloqueadores de anúncios /
  // Enhanced Tracking Protection do Firefox e uso offline derrubavam o import do
  // CDN em silêncio — sem exifr, o autofill de EXIF (GPS/data) simplesmente não
  // acontecia. exifr 7.1.3 (dist/full.esm.mjs), pinado; lê JPEG e HEIC.
  exifr = await import('./lib/exifr.esm.js').then(m => m.default || m);
} catch (e) { console.warn('exifr indisponível:', e); }

// Tom Select é UMD vendored em web/lib/ — sem CDN, sem dynamic ESM import
// (que falha quando esm.sh está bloqueado).
function _loadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src; s.onload = () => resolve(); s.onerror = () => reject(new Error(`falha ao carregar ${src}`));
    document.head.appendChild(s);
  });
}
if (!window.TomSelect) await _loadScript('./lib/tom-select.complete.min.js');
const TomSelect = window.TomSelect;
// N3.js VENDORADO (UMD → window.N3), como nas outras páginas: o import de
// esm.sh era a cadeia mais longa do boot (13 hops — ~1 s em rede boa, vários
// segundos no celular) e caía em silêncio com ETP/offline. Carregado sob
// demanda pelo loadCatalog, uma vez só.
let _n3P = null;
function n3Parser() {
  return _n3P ||= (window.N3 ? Promise.resolve() : _loadScript('./lib/n3.min.js'))
    .then(() => window.N3.Parser);
}
// (JSZip saiu daqui: nada nesta página o usava — o kit ZIP vive no app.js.)

// heic2any: HEIC → JPEG no cliente. Chrome/Firefox não decodificam HEIC
// nativamente; sem isto, `createImageBitmap` falha em arquivos de iPhone.
// Import NÃO-bloqueante e memoizado por promise: o boot não espera 1,35 MB
// (340 KB gz) que só o primeiro HEIC fora do Safari usa; quem precisar
// aguarda a promise (N cards concorrentes não disparam N imports). Prefetch
// eager só onde o fallback existe de fato — o Safari decodifica HEIC
// nativamente e nunca chega nele.
let heic2any = null, _heicP = null;
function heic2anyReady() {
  return _heicP ||= import('https://esm.sh/heic2any@0.0.4')
    .then(m => { heic2any = m.default; return heic2any; })
    .catch(() => { console.warn('heic2any indisponível — uploads HEIC só funcionarão no Safari.'); return null; });
}
if (!/^((?!chrome|android).)*safari/i.test(navigator.userAgent)) heic2anyReady();

// ===================== Helpers básicos =================================
function turtle_escape(s) {
  return (s || '').replace(/\\/g, '\\\\').replace(/"/g, '\\"')
    .replace(/\n/g, '\\n').replace(/\r/g, '\\r').replace(/\t/g, '\\t');
}
function escapeHtml(s) {
  // notify() e os status injetam via innerHTML — strings dinâmicas (nome de
  // arquivo, título de passeio do tours.ttl, mensagem de erro) passam por
  // aqui antes de interpolar.
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));
}
// FNV-1a 32-bit — fallback determinístico quando slugifyPerson não sobra
// nenhum caractere ASCII (nome 100% não-latino, ex: "田中太郎"). Sem isto,
// mintPerson não conseguia mintar IRI nenhuma pra essas pessoas (D2).
function hashPersonFallback(s) {
  let h = 0x811c9dc5;
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 0x01000193);
  }
  return (h >>> 0).toString(16).padStart(8, '0');
}
function slugifyPerson(s) {
  const slug = s.normalize('NFKD').replace(/\p{Diacritic}/gu, '')
    .split(/\s+/).map(w => w.replace(/[^A-Za-z0-9]/g, '')).filter(Boolean)
    .map(w => w[0].toUpperCase() + w.slice(1).toLowerCase()).join('');
  // Fallback (D2): mesmo nome bruto → mesmo hash → mesma IRI, então a
  // colisão intencional entre variações latinas do mesmo nome continua
  // igual; só o caso "slug ficou vazio" ganha uma saída em vez de falhar.
  return slug || `Anon${hashPersonFallback(s)}`;
}
function pad(n) { return String(n).padStart(2, '0'); }
function dateToLocalInput(d) {
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}` +
         `T${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}
// offsetOverride (ex: "+02:00"/"-03:00", vindo do EXIF OffsetTimeOriginal)
// prevalece sobre o fuso do navegador — o wall-clock em `s` normalmente veio
// do EXIF, que não carrega fuso; só sabemos o fuso real de gravação quando a
// câmera/telefone grava OffsetTimeOriginal (D4). Sem override, comportamento
// antigo (fuso do navegador) é mantido — o caso comum (SP filmado/subido em
// SP) não muda.
function localToXsdDateTime(s, offsetOverride) {
  const d = new Date(s); if (isNaN(d)) return null;
  let m = /^([+-])(\d{2}):?(\d{2})$/.exec(offsetOverride || '');
  let sign, oh, om;
  // Um OffsetTimeOriginal corrompido (ex.: "+45:00") passaria no regex e
  // assaria um xsd:dateTime inválido no catálogo — o XSD limita o fuso a
  // ±14:00. Fora da faixa, ignora o override e cai no fuso do navegador.
  if (m && (parseInt(m[2], 10) > 14 || parseInt(m[3], 10) > 59)) {
    console.warn(`EXIF OffsetTimeOriginal inválido (${offsetOverride}) — usando fuso do navegador`);
    m = null;
  }
  if (m) {
    [, sign, oh, om] = m;
  } else {
    const off = -d.getTimezoneOffset();
    sign = off >= 0 ? '+' : '-';
    oh = pad(Math.floor(Math.abs(off) / 60));
    om = pad(Math.abs(off) % 60);
  }
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}` +
         `T${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}` +
         `${sign}${oh}:${om}`;
}

// ===================== Hash perceptual (pHash) =========================
// pHash (Hacker Factor / Zauner): 32×32 cinza → DCT 2D → bloco 8×8 de
// baixa frequência → bit = 1 se coef > mediana, else 0. Resultado: 64 bits
// (16 hex). Mais robusto a mudanças de brilho/contraste/rotações pequenas
// do que um dHash gradient-based. Fotos quase idênticas → mesmo pHash (cluster id).
function dct1d(input, N) {
  const out = new Float32Array(N);
  for (let k = 0; k < N; k++) {
    let sum = 0;
    const f = Math.PI * k / (2 * N);
    for (let n = 0; n < N; n++) sum += input[n] * Math.cos((2 * n + 1) * f);
    out[k] = sum;
  }
  return out;
}
function pHashFromRgba(data, N) {
  // Grayscale matrix (linha-major)
  const m = new Float32Array(N * N);
  for (let i = 0; i < N * N; i++) {
    m[i] = data[i*4]*0.299 + data[i*4+1]*0.587 + data[i*4+2]*0.114;
  }
  // DCT 2D separável: linhas, depois colunas
  const tmp = new Float32Array(N * N);
  for (let y = 0; y < N; y++) {
    const out = dct1d(m.subarray(y * N, (y + 1) * N), N);
    for (let x = 0; x < N; x++) tmp[y * N + x] = out[x];
  }
  const dct = new Float32Array(N * N);
  const col = new Float32Array(N);
  for (let x = 0; x < N; x++) {
    for (let y = 0; y < N; y++) col[y] = tmp[y * N + x];
    const out = dct1d(col, N);
    for (let y = 0; y < N; y++) dct[y * N + x] = out[y];
  }
  // Bloco 8×8 de baixa frequência (top-left)
  const block = new Float32Array(64);
  for (let y = 0; y < 8; y++)
    for (let x = 0; x < 8; x++) block[y * 8 + x] = dct[y * N + x];

  // Mediana excluindo o termo DC (block[0])
  const sorted = Array.from(block.slice(1)).sort((a, b) => a - b);
  const median = sorted[Math.floor(sorted.length / 2)];

  let hex = '';
  for (let row = 0; row < 8; row++) {
    let byte = 0;
    for (let col2 = 0; col2 < 8; col2++) {
      byte = (byte << 1) | (block[row * 8 + col2] > median ? 1 : 0);
    }
    hex += byte.toString(16).padStart(2, '0');
  }
  return hex;
}

function computePHash(bitmap) {
  const N = 32;
  const c = document.createElement('canvas');
  c.width = N; c.height = N;
  c.getContext('2d').drawImage(bitmap, 0, 0, N, N);
  const data = c.getContext('2d').getImageData(0, 0, N, N).data;
  return pHashFromRgba(data, N);
}

// pHash de vídeo: amostra N quadros uniformes na duração, computa pHash
// de cada, e funde via voto majoritário por bit. Resultado é um pHash de
// 16 hex análogo ao de imagens — entra como IRI do clip (phd:video_<vhash>).
// Robusto a re-encoding: cortar/recomprimir o mesmo vídeo devolve pHash igual.
async function computeVideoPHash(file, N = 8) {
  const v = document.createElement('video');
  const url = URL.createObjectURL(file);
  v.src = url;
  const SIDE = 32;
  const C = document.createElement('canvas');
  C.width = SIDE; C.height = SIDE;
  const ctx = C.getContext('2d', { willReadFrequently: true });
  const bitsHistogram = new Uint16Array(64);
  let got = 0;
  // Desenha o quadro ATUAL do vídeo e soma seus bits no histograma.
  const accumulate = () => {
    ctx.drawImage(v, 0, 0, SIDE, SIDE);
    const hex = pHashFromRgba(ctx.getImageData(0, 0, SIDE, SIDE).data, SIDE);
    for (let row = 0; row < 8; row++) {
      const byte = parseInt(hex.substr(row * 2, 2), 16);
      for (let b = 0; b < 8; b++) if (byte & (1 << (7 - b))) bitsHistogram[row * 8 + b]++;
    }
    got++;
  };
  try {
    await primeVideoForFrames(v, 'vídeo não carregou pro pHash');
    const dur = Number.isFinite(v.duration) && v.duration > 0 ? v.duration : 0;
    if (dur > 0.15) {
      // Amostra N quadros ao longo da duração. Alguns navegadores (Firefox/
      // Safari) NÃO conseguem fazer seek em HEVC 4K 10-bit HDR — nesse caso o
      // seek falha; pulamos o quadro e, se NENHUM der certo (bail após 2
      // falhas seguidas sem sucesso), caímos pro quadro já decodificado.
      for (let i = 0; i < N; i++) {
        const t = Math.min(Math.max(0.05, ((i + 0.5) / N) * dur), Math.max(0.05, dur - 0.05));
        try {
          await robustVideoSeek(v, t, 'seek', 6000);
          await new Promise((r) => setTimeout(r, 24));   // deixa pintar o quadro
          accumulate();
        } catch (_) {
          if (got === 0 && i >= 1) break;
        }
      }
    }
    // Sem nenhum seek: usa o quadro já decodificado (o prime garante o 1º).
    if (got === 0) { try { await new Promise((r) => setTimeout(r, 24)); accumulate(); } catch (_) {} }
    // Último recurso: nem o quadro atual deu — hash do conteúdo do arquivo.
    if (got === 0) return await fileFallbackHash(file);
    const half = got / 2;
    let out = '';
    for (let row = 0; row < 8; row++) {
      let byte = 0;
      for (let b = 0; b < 8; b++) if (bitsHistogram[row * 8 + b] > half) byte |= (1 << (7 - b));
      out += byte.toString(16).padStart(2, '0');
    }
    // pHash uniforme (0000…/ffff…) = quadro preto/uniforme — o navegador
    // decodificou mas não desenhou o HEVC/HDR no canvas. Colidiria entre vídeos
    // diferentes (todos viram o mesmo IRI → 2º upload rejeitado como duplicado)
    // → cai pro hash do arquivo, que é único por arquivo.
    if (/^(.)\1{15}$/.test(out)) return await fileFallbackHash(file);
    return out;
  } finally {
    URL.revokeObjectURL(url);
    try { v.pause(); } catch (_) {}
    v.remove();
  }
}

// Fallback quando não dá pra extrair NENHUM quadro (ex.: HEVC 4K HDR que o
// navegador decodifica o 1º quadro mas trava no seek/canvas). Deriva 16 hex do
// início + tamanho do arquivo — dedup de re-upload EXATO (não é perceptual, mas
// evita travar o envio).
async function fileFallbackHash(file) {
  try {
    const digest = await crypto.subtle.digest('SHA-256', await file.slice(0, 1 << 20).arrayBuffer());
    const bytes = new Uint8Array(digest);
    let h = '';
    for (let i = 0; i < 6; i++) h += bytes[i].toString(16).padStart(2, '0');
    return (h + (file.size >>> 0).toString(16)).slice(0, 16).padEnd(16, '0');
  } catch (_) {
    return ((file.size || 0).toString(16) + '0000000000000000').slice(0, 16);
  }
}

// ===================== Processamento de imagem =========================
function drawToCanvas(bitmap, maxDim) {
  const w = bitmap.width, h = bitmap.height;
  const scale = Math.min(1, maxDim / Math.max(w, h));
  const cw = Math.max(1, Math.round(w * scale));
  const ch = Math.max(1, Math.round(h * scale));
  const c = document.createElement('canvas');
  c.width = cw; c.height = ch;
  c.getContext('2d').drawImage(bitmap, 0, 0, cw, ch);
  return c;
}
function encodeJpeg(canvas, q) {
  return new Promise(res => canvas.toBlob(b => res(b), 'image/jpeg', q));
}
async function compressToTarget(bitmap, maxBytes, startDim = 2400) {
  for (const dim of [startDim, 1800, 1400, 1100, 900, 700, 500]) {
    const canvas = drawToCanvas(bitmap, dim);
    for (const q of [0.85, 0.7, 0.55, 0.4, 0.3]) {
      const blob = await encodeJpeg(canvas, q);
      if (blob.size <= maxBytes) return blob;
    }
  }
  return await encodeJpeg(drawToCanvas(bitmap, 500), 0.3);
}
async function makeThumbnail(bitmap, dim = 256) {
  return await encodeJpeg(drawToCanvas(bitmap, dim), 0.75);
}
async function anonymizeJpeg(bitmap, q = 0.92) {
  // re-encoda sem usar EXIF da origem → strip de metadados
  return await encodeJpeg(drawToCanvas(bitmap, Math.max(bitmap.width, bitmap.height)), q);
}

// Reescreve a tag Orientation (0x0112) do IFD0 para 1 ("normal"). O canvas
// produz pixels já na orientação visual (createImageBitmap aplica EXIF), então
// manter a Orientation original faria o browser rotacionar de novo na exibição.
function normalizeExifOrientation(exifSeg) {
  if (exifSeg.length < 18) return;
  // exifSeg: FFE1 <len:2> "Exif\0\0" <tiff…>  → TIFF começa no offset 10
  const t = 10;
  const le = exifSeg[t] === 0x49 && exifSeg[t+1] === 0x49;
  const be = exifSeg[t] === 0x4D && exifSeg[t+1] === 0x4D;
  if (!le && !be) return;
  const u16 = (o) => le ? exifSeg[o] | (exifSeg[o+1] << 8)
                        : (exifSeg[o] << 8) | exifSeg[o+1];
  const u32 = (o) => le ? ((exifSeg[o]) | (exifSeg[o+1] << 8) | (exifSeg[o+2] << 16) | (exifSeg[o+3] << 24)) >>> 0
                        : ((exifSeg[o] << 24) | (exifSeg[o+1] << 16) | (exifSeg[o+2] << 8) | exifSeg[o+3]) >>> 0;
  if (u16(t + 2) !== 0x002A) return;
  const ifd0 = t + u32(t + 4);
  if (ifd0 + 2 > exifSeg.length) return;
  const n = u16(ifd0);
  for (let e = 0; e < n; e++) {
    const entry = ifd0 + 2 + e * 12;
    if (entry + 12 > exifSeg.length) break;
    if (u16(entry) === 0x0112) {
      // tipo SHORT(3), count 1 → valor fica nos 2 primeiros bytes de [entry+8..]
      exifSeg[entry + 8] = le ? 0x01 : 0x00;
      exifSeg[entry + 9] = le ? 0x00 : 0x01;
      return;
    }
  }
}

// Copia o APP1/Exif do JPEG de origem para um blob JPEG já re-encodado pelo
// canvas (que sempre nasce sem metadados). Se a origem não for JPEG ou não
// tiver Exif, devolve o blob alvo intacto.
async function copyExifSegment(sourceFile, targetBlob) {
  const src = new Uint8Array(await sourceFile.arrayBuffer());
  if (src.length < 4 || src[0] !== 0xFF || src[1] !== 0xD8) return targetBlob;

  let exifSeg = null;
  for (let i = 2; i < src.length - 4; ) {
    if (src[i] !== 0xFF) break;
    const marker = src[i + 1];
    if (marker === 0xDA || marker === 0xD9) break;   // SOS / EOI — acabou o cabeçalho
    const segLen = (src[i + 2] << 8) | src[i + 3];
    if (segLen < 2) break;
    if (marker === 0xE1 &&
        src[i + 4] === 0x45 && src[i + 5] === 0x78 &&    // 'E' 'x'
        src[i + 6] === 0x69 && src[i + 7] === 0x66 &&    // 'i' 'f'
        src[i + 8] === 0x00 && src[i + 9] === 0x00) {
      exifSeg = src.slice(i, i + 2 + segLen);
      break;
    }
    i += 2 + segLen;
  }
  if (!exifSeg) return targetBlob;
  normalizeExifOrientation(exifSeg);

  const tgt = new Uint8Array(await targetBlob.arrayBuffer());
  if (tgt[0] !== 0xFF || tgt[1] !== 0xD8) return targetBlob;
  const out = new Uint8Array(2 + exifSeg.length + (tgt.length - 2));
  out.set(tgt.subarray(0, 2), 0);
  out.set(exifSeg, 2);
  out.set(tgt.subarray(2), 2 + exifSeg.length);
  return new Blob([out], { type: 'image/jpeg' });
}

// ===================== Catálogo (tours + persons) ======================
const PHD_NS    = 'https://pedalhidrografi.co/data/';
const PH_NS     = 'https://id.pedalhidrografi.co/terms#';
const PES_NS    = 'https://id.pedalhidrografi.co/pessoas/';   // identidades resolvíveis (prefixo pes:)
const MED_NS    = 'https://id.pedalhidrografi.co/midia/';     // mídia (prefixo med:; IRI opaco med:<hash16>, tipo pela classe)
const LST_NS    = 'https://id.pedalhidrografi.co/listas/';    // listas/álbuns (prefixo lst:)
const SCHEMA    = 'https://schema.org/';
const RDF_TYPE  = 'http://www.w3.org/1999/02/22-rdf-syntax-ns#type';
const DCT_TITLE = 'http://purl.org/dc/terms/title';
const DCT_DATE  = 'http://purl.org/dc/terms/date';

function shortIRI(iri) {
  if (iri.startsWith(PHD_NS)) return `phd:${iri.slice(PHD_NS.length)}`;
  if (iri.startsWith(PH_NS))  return `ph:${iri.slice(PH_NS.length)}`;
  if (iri.startsWith(PES_NS)) return `pes:${iri.slice(PES_NS.length)}`;
  if (iri.startsWith(MED_NS)) return `med:${iri.slice(MED_NS.length)}`;
  if (iri.startsWith(LST_NS)) return `lst:${iri.slice(LST_NS.length)}`;
  // IRI completo de namespace desconhecido → bracketa, senão vira TTL inválido
  // ("Bad syntax (Prefix https: not bound)") ao ser emitido como termo.
  if (/^https?:\/\//i.test(iri)) return `<${iri}>`;
  return iri;
}
function seriesLabel(iri) {
  const slug = iri.startsWith(PHD_NS) ? iri.slice(PHD_NS.length) : iri;
  return slug === 'S' ? 'PH-S' : slug;
}
function fmtAssoc(label, n) {
  return `${label}${label.includes('-') ? ' ' : '-'}${n}`;
}

async function loadCatalog() {
  let Parser;
  try {
    Parser = await n3Parser();
  } catch (e) {
    throw new Error('N3.js indisponível.');
  }
  const tours = new Map(), persons = new Map(), lists = new Map();
  const types = new Map(), titles = new Map(), dts = new Map(), names = new Map();
  const inSE = new Map(), aSer = new Map(), aSeq = new Map();
  // hashes já presentes no servidor — usados pra rejeitar re-uploads. O IRI de
  // mídia é opaco (med:<hash>); o TIPO (foto/vídeo) vem da CLASSE, não do
  // prefixo — então classificamos DEPOIS do loop, com o `types` já montado.
  const existingPhashes = new Set();
  const existingVhashes = new Set();
  // tours.ttl tem os passeios; images.ttl tem as mídias (e seus hashes via IRI).
  // Os 4 dumps em PARALELO (eram 4 round trips em série, cada um um request no
  // Cloud Run); o parse segue na ordem da lista.
  const CATALOG_URLS = ['./data/tours.ttl', './data/images.ttl', './data/identities.ttl', './data/lists.ttl'];
  const texts = await Promise.all(CATALOG_URLS.map(url =>
    fetch(url).then(res => { if (!res.ok) throw new Error(`HTTP ${res.status}`); return res.text(); })
      .catch(e => { console.warn(`Catálogo: ${url} indisponível —`, e.message); return null; })));
  for (const [i, text] of texts.entries()) {
    const url = CATALOG_URLS[i];
    if (text == null) continue;
    try {
      for (const q of new Parser().parse(text)) {
        const s = q.subject.value, p = q.predicate.value, o = q.object.value;
        if (p === RDF_TYPE) { if (!types.has(s)) types.set(s, new Set()); types.get(s).add(o); }
        else if (p === DCT_TITLE) titles.set(s, o);
        else if (p === DCT_DATE)  dts.set(s, o.slice(0, 16));
        else if (p === SCHEMA + 'alternateName' || p === SCHEMA + 'name') names.set(s, o);
        else if (p === PH_NS + 'inSeriesEdition') { if (!inSE.has(s)) inSE.set(s, new Set()); inSE.get(s).add(o); }
        else if (p === PH_NS + 'inEventSeries')    aSer.set(s, o);
        else if (p === PH_NS + 'sequenceInSeries') aSeq.set(s, parseInt(o, 10));
      }
    } catch (e) {
      console.warn(`Catálogo: ${url} indisponível —`, e.message);
    }
  }
  // Classifica os hashes por CLASSE (foto → phash, vídeo → vhash).
  for (const [s, ts] of types) {
    if (!s.startsWith(MED_NS)) continue;
    const h = s.slice(MED_NS.length);
    if (!/^[0-9a-f]{16}$/i.test(h)) continue;
    if (ts.has(PH_NS + 'StillImage')) existingPhashes.add(h.toLowerCase());
    else if (ts.has(PH_NS + 'MotionImage')) existingVhashes.add(h.toLowerCase());
  }
  for (const [s, ts] of types) {
    if (ts.has(PH_NS + 'Tour')) {
      const assocs = [];
      for (const a of inSE.get(s) || []) {
        const sr = aSer.get(a), n = aSeq.get(a);
        if (sr && Number.isInteger(n)) assocs.push({ label: seriesLabel(sr), n });
      }
      assocs.sort((a, b) => a.label.localeCompare(b.label, 'pt-BR'));
      tours.set(s, { title: titles.get(s) || s, dateTime: dts.get(s) || '', assocs });
    }
    if (ts.has(SCHEMA + 'Person')) persons.set(s, { name: names.get(s) || s });
    if (ts.has(SCHEMA + 'Collection')) lists.set(s, { name: names.get(s) || s.split(/[/#]/).pop() });
  }
  return { tours, persons, lists, existingPhashes, existingVhashes };
}

const tourItems     = [];
const tourCatalog   = [];                  // { value, ms, label } para auto-detecção
const personOptions = [];
const newPersons    = new Map();           // iri → nome
const cards         = [];                  // [{ index, file, phash, bitmap, elem, authorTs, providerTs, listTs, skipAutoDetect }]
const personSelects = [];                  // todas as instâncias TomSelect ligadas a pessoas
// Listas (álbuns) — mesmo trio que pessoas: opções, listas novas cunhadas, e

const listOptions   = [];                  // { value: 'lst:x', text: 'Nome' }
const newLists      = new Map();           // iri → nome
const listSelects   = [];
// pHashes (16-hex) das imagens já no servidor — preenchido pelo bootstrap
// do catálogo. Usado para rejeitar re-uploads antes de chamar o backend.
const existingPhashes = [];
const existingVhashes = [];

const TOUR_WINDOW_BEFORE_MS =  2 * 3600 * 1000;
const TOUR_WINDOW_AFTER_MS  = 12 * 3600 * 1000;
const COMPRESS_TARGET_BYTES = 500 * 1024;
// Hamming distance ≤ este valor → tratamos como duplicata e rejeitamos.
// 0 = idêntico; 5 = "mesma foto, processada diferente"; 10+ começa a aceitar quadros sequenciais.
const PHASH_DUP_THRESHOLD   = 5;

function hammingDistance(h1, h2) {
  if (!h1 || !h2 || h1.length !== h2.length) return Infinity;
  let total = 0;
  for (let i = 0; i < h1.length; i += 2) {
    let x = parseInt(h1.substr(i, 2), 16) ^ parseInt(h2.substr(i, 2), 16);
    while (x) { total += x & 1; x >>>= 1; }
  }
  return total;
}

let cardCounter = 0;
let pickerBusy  = false;   // guarda contra re-entrada do handler de #files

// ===================== Bootstrap catálogo ==============================
try {
  const { tours, persons, lists, existingPhashes: srvHashes, existingVhashes: srvVHashes } = await loadCatalog();
  for (const h of srvHashes) existingPhashes.push(h);
  for (const h of srvVHashes) existingVhashes.push(h);
  for (const [iri, m] of tours) {
    const assocStr = m.assocs.map(a => fmtAssoc(a.label, a.n)).join(' & ');
    const head = m.dateTime ? `${m.dateTime}: ` : '';
    const tail = assocStr ? `. ${assocStr}` : '';
    tourItems.push({ value: shortIRI(iri), label: `${head}${m.title}${tail}`, _dt: m.dateTime });
  }
  tourItems.sort((a, b) => (b._dt || '').localeCompare(a._dt || ''));
  for (const it of tourItems) {
    if (!it._dt) continue;
    const ms = new Date(it._dt).getTime();
    if (!isNaN(ms)) tourCatalog.push({ value: it.value, ms, label: it.label });
  }
  for (const [iri, m] of persons) {
    personOptions.push({ value: shortIRI(iri), text: m.name });
  }
  personOptions.sort((a, b) => a.text.localeCompare(b.text, 'pt-BR'));
  for (const [iri, m] of lists) {
    listOptions.push({ value: shortIRI(iri), text: m.name });
  }
  listOptions.sort((a, b) => a.text.localeCompare(b.text, 'pt-BR'));
  if (tours.size || persons.size) {
    $('#catalogStatus').innerHTML =
      `<span class="ok">Catálogo: ${tours.size} passeios, ${persons.size} pessoas, ${existingPhashes.length} imagens, ${existingVhashes.length} vídeos.</span>`;
  } else {
    $('#catalogStatus').innerHTML = `<span class="warn">Catálogo vazio.</span>`;
  }
} catch (e) {
  $('#catalogStatus').innerHTML = `<span class="warn">Catálogo indisponível (${escapeHtml(e.message)}).</span>`;
}

// Popula os painéis de Padrões (lote 1 + append)
function populateTourSelect(selectEl) {

    const opt = document.createElement('option');
    opt.value = it.value;
    opt.textContent = it.label;
    selectEl.appendChild(opt);

populateTourSelect($('#d-tour'));

// Pré-seleciona o passeio default a partir de `?tour=phd:tour_N` na URL —
// usado pelos botões "+ mídias" do censo.html pra abrir o form já apontando
// pro passeio em questão. Se o valor não bater com nenhuma opção do select,
// é silenciosamente ignorado (e o usuário escolhe na mão).
(() => {
  const want = new URLSearchParams(location.search).get('tour');
  if (!want) return;
  const sel = $('#d-tour');
  for (const opt of sel.options) {
    if (opt.value === want) { sel.value = want; return; }
  }
  // Forma curta: só o slug (ex.: ?tour=t9bb4v7t, vindo do botão "enviar
  // mídias" do upload_tour.html) — casa com o IRI completo do select.
  for (const opt of sel.options) {
    if (opt.value.endsWith(`/passeio/${want}>`)) { sel.value = opt.value; return; }
  }
})();

// ===================== Mint pessoa nova ================================
// Slug de identidade OPACO e aleatório (8 chars, base32 Crockford sem i/l/o/u):
// nunca derivado do nome (que é editável). IRI = pes:<slug>. Duas pessoas com o
// mesmo nome são pessoas distintas — reuse os já-existentes pelo picker.
function randPersonSlug(n = 8) {
  const A = '0123456789abcdefghjkmnpqrstvwxyz';
  const b = crypto.getRandomValues(new Uint8Array(n));
  let s = '';
  for (let i = 0; i < n; i++) s += A[b[i] & 31];
  return s;
}
function mintPerson(input) {
  const name = input.trim();
  if (!name) return null;
  const iri  = `pes:${randPersonSlug()}`;
  newPersons.set(iri, name);
  const opt = { value: iri, text: name };
  personOptions.push(opt);
  for (const ts of personSelects) ts.addOption(opt);
  return { value: iri, text: name };
}

function initPersonSelect(selectEl) {
  const ts = new TomSelect(selectEl, {
    options: [...personOptions],
    valueField: 'value',
    labelField: 'text',
    searchField: ['text'],
    plugins: ['remove_button'],
    persist: false,
    // Renderiza o dropdown no <body>, não dentro do card — a galeria de cards
    // rola na horizontal com overflow-y: hidden, que senão cortaria o dropdown.
    dropdownParent: 'body',
    create: (input) => mintPerson(input) || false,
    render: {
      option_create: (data, escape) =>
        `<div class="create">+ adicionar <strong>${escape(data.input)}</strong></div>`,
    },
    sortField: { field: 'text', direction: 'asc' },
    maxOptions: 500,
  });
  // Tom Select prepende o item "+ adicionar" no topo (insertBefore firstChild
  // em refreshOptions, sem opção de config). Reposicionamos no fim a cada
  // refresh para que matches reais apareçam primeiro.
  const origRefresh = ts.refreshOptions.bind(ts);
  ts.refreshOptions = function (triggerDropdown) {
    origRefresh(triggerDropdown);
    const create = this.dropdown_content.querySelector('.create');
    if (create && create !== this.dropdown_content.lastElementChild) {
      this.dropdown_content.appendChild(create);
    }
  };
  // Nesta config o texto digitado na busca não some sozinho ao selecionar um
  // item (clique ou Enter) — sobra no campo pro próximo item. Limpa na mão.
  ts.on('item_add', () => ts.setTextboxValue(''));
  personSelects.push(ts);
  return ts;
}
function destroyPersonSelect(ts) {
  if (!ts) return;
  const i = personSelects.indexOf(ts);
  if (i >= 0) personSelects.splice(i, 1);
  try { ts.destroy(); } catch (_) {}
}

// ===================== Mint / picker de LISTAS (álbuns) ================
// Slug minúsculo idêntico ao app.js e ao imagens.html — pra que a MESMA lista
// criada em lugares diferentes case na mesma IRI lst:<slug>.
function slugifyList(name) {
  return (name || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '') || 'lista';
}
function mintList(input) {
  const name = (input || '').trim();
  if (!name) return null;
  const iri = `lst:${slugifyList(name)}`;
  if (!newLists.has(iri) && !listOptions.some(o => o.value === iri)) {
    newLists.set(iri, name);
    const opt = { value: iri, text: name };
    listOptions.push(opt);
    for (const ts of listSelects) ts.addOption(opt);
  }
  return { value: iri, text: name };
}
function initListSelect(selectEl) {
  const ts = new TomSelect(selectEl, {
    options: [...listOptions],
    valueField: 'value',
    labelField: 'text',
    searchField: ['text'],
    plugins: ['remove_button'],
    persist: false,
    create: (input) => mintList(input) || false,
    render: {
      option_create: (data, escape) =>
        `<div class="create">+ criar lista <strong>${escape(data.input)}</strong></div>`,
    },
    sortField: { field: 'text', direction: 'asc' },
    maxOptions: 500,
  });
  const origRefresh = ts.refreshOptions.bind(ts);
  ts.refreshOptions = function (triggerDropdown) {
    origRefresh(triggerDropdown);
    const create = this.dropdown_content.querySelector('.create');
    if (create && create !== this.dropdown_content.lastElementChild) {
      this.dropdown_content.appendChild(create);
    }
  };
  ts.on('item_add', () => ts.setTextboxValue(''));
  listSelects.push(ts);
  return ts;
}
function destroyListSelect(ts) {
  if (!ts) return;
  const i = listSelects.indexOf(ts);
  if (i >= 0) listSelects.splice(i, 1);
  try { ts.destroy(); } catch (_) {}
}

// ===================== Modo edição (?edit=<iri>) =======================
// Edita metadados de UMA mídia existente SEM reenviar blobs: prefill a partir
// de uploads.ttl e POST predicate-patch em /update-image|/update-video.
const EDIT_IRI = new URLSearchParams(location.search).get('edit');
if (EDIT_IRI) {
  startEditMode(EDIT_IRI).catch((e) => {
    $('#cards').innerHTML = `<p style="color:#b3261e">Não consegui abrir a edição: ${escapeHtml(e.message)}</p>`;
  });
}

function xsdOffset(xsd) {
  const m = /([+-]\d{2}:\d{2}|Z)$/.exec(xsd || '');
  return m ? (m[1] === 'Z' ? '+00:00' : m[1]) : null;
}

async function extractMediaFields(iri) {
  const EXIF = 'http://www.w3.org/2003/12/exif/ns#';
  const PROV = 'http://www.w3.org/ns/prov#';
  const PAV  = 'http://purl.org/pav/';
  const DCT_LIC = 'http://purl.org/dc/terms/license';
  // IRI de mídia é opaco (med:<hash>); o hash é o localname, e o TIPO
  // (foto/vídeo) vem da CLASSE no catálogo (detectado no loop abaixo).
  const hash = iri.startsWith(MED_NS) ? iri.slice(MED_NS.length) : iri.split('/').pop();
  const Parser = await n3Parser();
  const res = await fetch('./data/images.ttl', { cache: 'no-cache' });
  if (!res.ok) throw new Error('uploads.ttl indisponível (' + res.status + ')');
  const text = await res.text();
  const latOf = new Map(), lonOf = new Map();
  const f = { kind: 'image', hash, iri, date: '', offset: null, lat: '', lon: '',
    bearing: '', focal: '', tour: '', authors: [], providers: [], lists: [],
    license: '', anon: false, comp: false, found: false };
  let locTarget = null;
  for (const q of new Parser().parse(text)) {
    const s = q.subject.value, p = q.predicate.value, o = q.object.value;
    if (p === SCHEMA + 'latitude')  latOf.set(s, o);
    if (p === SCHEMA + 'longitude') lonOf.set(s, o);
    if (s !== iri) continue;
    f.found = true;
    if (p === RDF_TYPE && o === PH_NS + 'MotionImage') f.kind = 'video';   // tipo pela classe
    else if (p === DCT_DATE) { f.offset = xsdOffset(o); f.date = o.slice(0, 16); }
    else if (p === SCHEMA + 'locationCreated') locTarget = o;
    else if (p === EXIF + 'gpsImgDirection') f.bearing = o;
    else if (p === EXIF + 'focalLengthIn35mmFilm') f.focal = o;
    else if (p === PH_NS + 'capturedDuring') f.tour = shortIRI(o);
    else if (p === PROV + 'wasAttributedTo') f.authors.push(shortIRI(o));
    else if (p === PAV + 'providedBy') f.providers.push(shortIRI(o));
    else if (p === SCHEMA + 'isPartOf') f.lists.push(shortIRI(o));
    else if (p === DCT_LIC) f.license = o;
    else if (p === PH_NS + 'anonymized') f.anon = (o === 'true');
    else if (p === PH_NS + 'compressed') f.comp = (o === 'true');
  }
  if (!f.found) throw new Error('mídia não encontrada no catálogo');
  if (locTarget) { f.lat = latOf.get(locTarget) || ''; f.lon = lonOf.get(locTarget) || ''; }
  return f;
}

  const uz = $('#upload-zone'); if (uz) uz.style.display = 'none';

  const licOptions = [
    ['https://creativecommons.org/licenses/by-sa/4.0/', 'CC BY-SA 4.0'],
    ['https://creativecommons.org/licenses/by-nc-sa/4.0/', 'CC BY-NC-SA 4.0'],
    ['https://creativecommons.org/licenses/by/4.0/', 'CC BY 4.0'],
    ['https://creativecommons.org/licenses/by-nc/4.0/', 'CC BY-NC 4.0'],
    ['https://creativecommons.org/publicdomain/zero/1.0/', 'CC0 1.0'],
  ].map(([v, t]) => `<option value="${v}"${v === f.license ? ' selected' : ''}>${t}</option>`).join('');
  const grid = 'style="display:grid;grid-template-columns:1fr 1fr;gap:.5rem"';

        `<div><label>Longitude</label><input type="number" data-e="lon" step="any" value="${escapeHtml(f.lon)}"></div>` +

    `<div class="card-section">` +

async function saveMediaEdit(f, card, authorTs, providerTs, listTs, orig) {
  const val = (sel) => $(`[data-e="${sel}"]`, card).value.trim();
  const dateXsd = localToXsdDateTime(val('date'), f.offset);
  const lat = num(val('lat')), lon = num(val('lon'));
  const tour = val('tour'), license = val('license');
  const authors = authorTs.getValue(), providers = providerTs.getValue(), lists = listTs.getValue();
  const isImg = f.kind === 'image';
  const bearing = isImg ? num($('[data-e="bearing"]', card).value) : '';
  const focal   = isImg ? num($('[data-e="focal"]', card).value) : '';
  const anon = isImg && $('[data-e="anon"]', card).checked;
  const comp = isImg && $('[data-e="comp"]', card).checked;

  // Data e GPS opcionais (SHACL só avisa) — mas metade de um GPS é erro.
  if ((lat === '') !== (lon === '')) throw new Error('GPS incompleto: preencha lat E lon (ou nenhum)');
  const hasGeo = lat !== '' && lon !== '';

  const iriCurie = shortIRI(f.iri);
  // rdf:type SEMPRE afirmado no patch: synthesize_media_patch substitui todo
  // predicado afirmado, então o conjunto de tipos final é exatamente este —
  // ph:GeoreferencedImage entra/sai conforme o GPS (mídia com GPS = marcador).
  const baseType = isImg ? 'ph:StillImage' : 'ph:MotionImage';
  const P = [`a ${baseType}${hasGeo ? ', ph:GeoreferencedImage' : ''}`,
             `dcterms:license <${license}>`];
  const remove = [];
  if (dateXsd) P.push(`dcterms:date "${dateXsd}"^^xsd:dateTime`); else remove.push('dcterms:date');
  // GPS — só mexe se mudou (evita orfanar o nó de geo antigo).
  const gpsChanged = String(lat) !== String(orig.lat) || String(lon) !== String(orig.lon);
  let geoNode = '';
  if (gpsChanged) {
    if (hasGeo) {
      P.push(`schema:locationCreated ${iriCurie}_geo`);
      geoNode = `\n${iriCurie}_geo a schema:GeoCoordinates ;\n    schema:latitude "${lat}"^^xsd:decimal ;\n    schema:longitude "${lon}"^^xsd:decimal .`;
    } else {
      remove.push('schema:locationCreated');   // limpou o GPS → some a coordenada (e o tipo georref acima)
    }
  }
  if (isImg) {
    if (bearing !== '') P.push(`exif:gpsImgDirection "${bearing}"^^xsd:decimal`); else remove.push('exif:gpsImgDirection');
    if (focal !== '')   P.push(`exif:focalLengthIn35mmFilm "${focal}"^^xsd:decimal`); else remove.push('exif:focalLengthIn35mmFilm');
    if (anon) P.push('ph:anonymized true'); else remove.push('ph:anonymized');
    if (comp) P.push('ph:compressed true'); else remove.push('ph:compressed');
  }
  if (tour) P.push(`ph:capturedDuring ${tour}`); else remove.push('ph:capturedDuring');
  if (authors.length)   for (const a of authors)   P.push(`prov:wasAttributedTo ${a}`); else remove.push('prov:wasAttributedTo');
  if (providers.length) for (const p of providers) P.push(`pav:providedBy ${p}`);        else remove.push('pav:providedBy');
  if (lists.length)     for (const l of lists)     P.push(`schema:isPartOf ${l}`);        else remove.push('schema:isPartOf');

  const prefixes = [
    '@prefix dcterms: <http://purl.org/dc/terms/> .',
    '@prefix exif:    <http://www.w3.org/2003/12/exif/ns#> .',
    '@prefix pav:     <http://purl.org/pav/> .',
    '@prefix ph:      <https://id.pedalhidrografi.co/terms#> .',
    '@prefix phd:     <https://pedalhidrografi.co/data/> .',
    '@prefix pes:     <https://id.pedalhidrografi.co/pessoas/> .',
    '@prefix med:     <https://id.pedalhidrografi.co/midia/> .',
    '@prefix lst:     <https://id.pedalhidrografi.co/listas/> .',
    '@prefix prov:    <http://www.w3.org/ns/prov#> .',
    '@prefix schema:  <https://schema.org/> .',
    '@prefix xsd:     <http://www.w3.org/2001/XMLSchema#> .',
  ].join('\n');
  const usedP = [...authors, ...providers].filter((v) => newPersons.has(v));
  const personDecls = usedP.length
    ? '\n# Pessoas novas\n' + usedP.map((iri) =>
        `${iri} a schema:Person ;\n    schema:alternateName "${turtle_escape(newPersons.get(iri))}" .`).join('\n\n') + '\n'
    : '';
  const listDecls = buildNewListDecls(lists);
  const body = `${iriCurie}\n    ${P.join(' ;\n    ')} .${geoNode}`;
  const ttl = `${prefixes}\n${personDecls}${listDecls}\n${body}\n`;

  const fd = new FormData();
  fd.append('ttl', ttl);
  fd.append('remove', remove.join(','));
  const url = (f.kind === 'image' ? './update-image/' : './update-video/') + encodeURIComponent(f.hash);
  const res = await fetch(url, { method: 'POST', body: fd });
  if (!res.ok) {
    let msg = `HTTP ${res.status}`;
    try { const j = await res.json(); msg = (j.details && j.details.join('; ')) || j.error || msg; } catch (e) {}
    throw new Error(msg);
  }
  notifyParentChanged('update-' + f.kind, f.hash);
  return res.json();
}

function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

// Lê autoras/quem-subiu de um card mesmo antes do Tom Select ser ativado
// (A3): antes da ativação, os valores ficam em `card.pendingAuthors`/
// `pendingProviders` (aplicados via setValue só na hora da ativação).
// `field` é 'author' ou 'provider'.
function personValues(card, field) {
  const ts = card[field + 'Ts'];
  if (ts) return ts.getValue();
  return card['pending' + capitalize(field) + 's'] || [];
}

// Idem para listas do card (antes da ativação, ficam em card.pendingLists).
function listValues(card) {
  const ts = card.listTs;
  if (ts) return ts.getValue();
  return card.pendingLists || [];
}

// ===================== Ativação preguiçosa de cards (A3) ================
// Tom Select (2 instâncias/card) e a prévia de vídeo custam CPU/memória —
// num lote de 180 cards seriam 360 instâncias TS + 20 <video> montados de
// uma vez. Só ativamos quando o card entra perto da viewport (rootMargin
// 200px) OU ganha foco antes disso (navegação por teclado/leitor de tela).
const cardActivationObserver = new IntersectionObserver((entries) => {
  for (const entry of entries) {
    if (entry.isIntersecting && entry.target._card) activateCard(entry.target._card);
  }
}, { rootMargin: '200px' });

function scheduleCardActivation(card) {
  card.elem._card = card;
  cardActivationObserver.observe(card.elem);
  card.elem.addEventListener('focusin', () => activateCard(card), { once: true });
}

// Retorna uma Promise: p/ cards não-vídeo resolve assim que os efeitos
// síncronos de ativação terminam; p/ vídeo só resolve depois do
// 'loadedmetadata' (ou 'error', p/ não travar num arquivo quebrado — os
// checks de validade do uploadVideoCard cuidam desse caso) da prévia, já
// que é esse evento que popula card.duration + os defaults de recorte.
// Idempotente e reentrante: chamadas repetidas (incl. concorrentes) num
// card já ativado resolvem na hora, sem reativar nada.
function activateCard(card) {
  if (card.activated) return Promise.resolve();
  card.activated = true;
  cardActivationObserver.unobserve(card.elem);

  card.authorTs   = initPersonSelect($('[data-field="author"]',   card.elem));
  card.providerTs = initPersonSelect($('[data-field="provider"]', card.elem));
  card.listTs     = initListSelect($('[data-field="list"]', card.elem));
  if (card.pendingAuthors?.length)   card.authorTs.setValue(card.pendingAuthors);
  if (card.pendingProviders?.length) card.providerTs.setValue(card.pendingProviders);
  if (card.pendingLists?.length)     card.listTs.setValue(card.pendingLists);

  if (card.kind === 'video') {
    const preview = $('.card-video-preview', card.elem);
    return new Promise((resolve) => {
      if (!preview) { resolve(); return; }
      if (preview.src) { resolve(); return; }   // já ativado por outra via — não deveria acontecer, mas não trava
      // Timeout de segurança (mesmo padrão do waitVideoEvent): sem isto, uma
      // prévia que nunca dispara loadedmetadata/error (arquivo problemático)
      // travaria activateCard — e com ele, uploadVideoCard e o loop inteiro
      // de "Enviar todas" — pra sempre.
      let to = 0;
      const off  = () => { clearTimeout(to); preview.removeEventListener('loadedmetadata', ok); preview.removeEventListener('error', ok); };
      const ok   = () => { off(); resolve(); };
      preview.addEventListener('loadedmetadata', ok, { once: true });
      preview.addEventListener('error',          ok, { once: true });
      to = setTimeout(ok, 15000);
      preview.src = URL.createObjectURL(card.file);
    });
  }
  return Promise.resolve();
}

// ===================== Auto-detecção do passeio ========================
function autoDetectTour(card) {
  if (card.skipAutoDetect) return;
  if (!tourCatalog.length) return;
  const dateInput  = $('[data-field="date"]',  card.elem);
  const tourSelect = $('[data-field="tour"]',  card.elem);
  const status     = $('.tour-auto-status',    card.elem);
  if (!dateInput.value) { status.textContent = ''; return; }
  const ms = new Date(dateInput.value).getTime();
  if (isNaN(ms)) return;
  const matches = tourCatalog.filter(t =>
    ms >= t.ms - TOUR_WINDOW_BEFORE_MS && ms <= t.ms + TOUR_WINDOW_AFTER_MS
  );
  if (!matches.length) {
    status.innerHTML = `<span class="warn">Nenhum passeio em −2h / +12h.</span>`;
    return;
  }
  matches.sort((a, b) => Math.abs(ms - a.ms) - Math.abs(ms - b.ms));
  const best = matches[0];
  tourSelect.value = best.value;
  status.innerHTML = `<span class="ok">Detectado: ${escapeHtml(best.label)}</span>` +
    (matches.length > 1 ? ` <span class="warn">(${matches.length - 1} outros)</span>` : '');
}

function removeCard(card) {
  cardActivationObserver.unobserve(card.elem);   // no-op se já ativado/desativado
  destroyPersonSelect(card.authorTs);
  destroyPersonSelect(card.providerTs);
  try { URL.revokeObjectURL($('.card-thumb', card.elem).src); } catch (_) {}
  const previewEl = $('.card-video-preview', card.elem);
  if (previewEl?.src) { try { URL.revokeObjectURL(previewEl.src); } catch (_) {} }
  removeThumbFromGrid(card);
  card.elem.remove();
  const i = cards.indexOf(card);
  if (i >= 0) cards.splice(i, 1);
  refreshGenerateButtons();
  updateCarouselNav();
}

function addThumbToGrid(card) {
  const btn = document.createElement('button');

    img.src = card.gridThumbUrl;

// Foca um card: rola SÓ a faixa horizontal até centralizar o card e dá um
// realce breve. Usa scrollBy no próprio container (não scrollIntoView, que
// mexeria também no scroll VERTICAL da página — os cards são altos e a página
// pularia). A posição da tela não muda; só a faixa rola na horizontal.
function focusCard(card) {
  const cont = cardsStripEl;
  const cr = card.elem.getBoundingClientRect();
  const rr = cont.getBoundingClientRect();
  const delta = (cr.left - rr.left) - (cont.clientWidth - cr.width) / 2;
  cont.scrollBy({ left: delta, behavior: 'smooth' });
  card.elem.classList.add('card-flash');
  setTimeout(() => card.elem.classList.remove('card-flash'), 800);
}

}
